<ng-container *ngIf="productList?.length; else emptyMessage">
  <mat-grid-list cols="4" rowHeight="380px">
    @for (product of productList; track product) {
      <mat-grid-tile>
        <mat-card
          class="product-container"
          (click)="goToProductDetails(product)"
        >
          <img
            mat-card-image
            [src]="product.imgUrl"
            [alt]="product.title"
            class="product-image"
          />

          <mat-card-content>
            <p class="product-title">{{ product.title }}</p>
            <div class="product-details">
              <div class="product-rating">
                <mat-icon color="accent">star</mat-icon>
                <span>{{ product.stars }}</span>
              </div>
              <p class="product-sold">{{ product.boughtInLastMonth }} sold</p>
            </div>
            <h3 class="product-price text-accent">
              {{ product.price | currency }}
            </h3>
          </mat-card-content>
          <mat-card-actions>
            <button
              mat-flat-button
              color="accent"
              (click)="addProductToCart($event, product)"
            >
              Add to cart
            </button>
          </mat-card-actions>
        </mat-card>
      </mat-grid-tile>
    }
  </mat-grid-list>
</ng-container>

<ng-template #emptyMessage>
  <mat-card class="message-container">
    <mat-card-content>
      <p>No results found</p>
    </mat-card-content>
  </mat-card>
</ng-template>
