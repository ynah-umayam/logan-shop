<div *ngIf="products && formArray" class="cart-details__container">
  <div class="cart-details__total">
    <h2>
      Total <span>{{ totalItems }} items: </span>
      <span class="text-accent">{{ totalPrice | currency }}</span>
    </h2>
    <button
      mat-flat-button
      color="accent"
      class="product-button"
      [disabled]="getSelectedProducts().length === 0"
      (click)="checkout()"
    >
      Check out
    </button>
    <button
      mat-stroked-button
      color="secondary"
      class="product-button"
      (click)="goToMain()"
    >
      Cancel
    </button>
  </div>
  <table mat-table [dataSource]="products" class="mat-elevation-z8">
    <!-- Checkbox Column -->
    <ng-container matColumnDef="select">
      <th mat-header-cell *matHeaderCellDef class="select-column">
        <mat-checkbox
          (change)="toggleAllRows()"
          [checked]="isAllSelected()"
          [indeterminate]="getSelectedProducts().length > 0 && !isAllSelected()"
        >
        </mat-checkbox>
      </th>
      <td mat-cell *matCellDef="let row; let i = index" class="select-column">
        <mat-checkbox [formControl]="getControl(i, 'select')"> </mat-checkbox>
      </td>
    </ng-container>

    <!-- Product Column -->
    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef class="product-column">Product</th>
      <td mat-cell *matCellDef="let row" class="product-column">
        <div class="cart-details__product">
          <div>
            <img
              [src]="row.imgUrl"
              [alt]="row.title"
              class="cart-details__product-image"
            />
          </div>

          <div class="cart-details__product-title">{{ row.title }}</div>
        </div>
      </td>
    </ng-container>

    <!-- Unit Price Column -->
    <ng-container matColumnDef="price">
      <th mat-header-cell *matHeaderCellDef class="price-column">Price</th>
      <td mat-cell *matCellDef="let row" class="price-column">
        {{ row.price | currency }}
      </td>
    </ng-container>

    <!-- Quantity Column -->
    <ng-container matColumnDef="quantity">
      <th mat-header-cell *matHeaderCellDef class="quantity-column">
        Quantity
      </th>
      <td mat-cell *matCellDef="let row; let i = index" class="quantity-column">
        <app-quantity [form]="getControl(i, 'quantity')"></app-quantity>
      </td>
    </ng-container>

    <!-- Total Price Column -->
    <ng-container matColumnDef="totalPrice">
      <th mat-header-cell *matHeaderCellDef class="price-column">
        Total Price
      </th>
      <td mat-cell *matCellDef="let row" class="price-column">
        {{ row.totalPrice | currency }}
      </td>
    </ng-container>

    <!-- Delete Column -->
    <ng-container matColumnDef="delete">
      <th mat-header-cell *matHeaderCellDef class="delete-column">Delete</th>
      <td mat-cell *matCellDef="let row; let i = index" class="delete-column">
        <button
          mat-icon-button
          color="primary"
          (click)="removeProductFromCart(row)"
        >
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
