<div class="logo-container">
  <app-logo></app-logo>
</div>
<div class="login-container">
  <app-shared-container>
    <div header>Login</div>
    <div content>
      <form class="login-content" [formGroup]="formGroup">
        <div *ngIf="isAuthenticationFailed" class="message-container--danger">
          <p class="text-danger">
            Your account and/or password is incorrect, please try again.
          </p>
        </div>
        <div class="login-content__input-container">
          <mat-form-field appearance="outline" class="login-content__input">
            <mat-label>Email</mat-label>
            <input
              matInput
              type="email"
              formControlName="email"
              placeholder="Email"
            />
            <mat-error *ngIf="formGroup.get('email')?.hasError('required')">
              Email is required
            </mat-error>
            <mat-error *ngIf="formGroup.get('email')?.hasError('email')">
              Please enter a valid email address
            </mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline" class="login-content__input">
            <mat-label>Password</mat-label>
            <input
              matInput
              type="password"
              formControlName="password"
              placeholder="Password"
            />
            <mat-error *ngIf="formGroup.get('password')?.hasError('required')">
              Password is required
            </mat-error>
          </mat-form-field>
        </div>
      </form>
    </div>
    <div actions class="login-content__buttons">
      <button
        mat-flat-button
        (click)="forgotPassword()"
        class="login-content__button"
      >
        Forgot password
      </button>
      <button
        mat-flat-button
        [disabled]="!formGroup.valid"
        color="primary"
        (click)="login()"
        class="login-content__button"
      >
        Log in
      </button>
      <button mat-flat-button (click)="signUp()" class="login-content__button">
        Sign up
      </button>
    </div>
  </app-shared-container>
</div>
